<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rosa Cosmétiques - كاشف الأسعار</title>
    <!-- مكتبة قراءة الباركود -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }
        .card {
            background-color: #1e1e1e;
            width: 100%;
            max-width: 420px;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            text-align: center;
        }
        .title { color: #e91e63; font-size: 22px; font-weight: bold; margin-bottom: 5px; }
        .subtitle { color: #aaa; font-size: 13px; margin-bottom: 20px; }
        .btn-camera {
            background-color: #e91e63;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 15px;
        }
        #reader {
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
            border: 2px solid #e91e63;
        }
        .input-box {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e91e63;
            background-color: #2a2a2a;
            color: #fff;
            font-size: 18px;
            text-align: center;
            outline: none;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #2a2a2a;
            border-radius: 10px;
            text-align: right;
        }
        .field-label { color: #aaa; font-size: 12px; margin-top: 8px; }
        .field-value { font-size: 16px; font-weight: bold; margin-bottom: 8px; }
        .price-tag {
            background-color: #880e4f;
            color: #fff;
            font-size: 26px;
            font-weight: bold;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin: 15px 0;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="title">🌹 ROSA COSMÉTIQUES 🌹</div>
    <div class="subtitle">واجهتك الأولى للعناية والجمال - كاشف الأسعار</div>

    <button type="button" class="btn-camera" id="start-scan-btn">📷 فتح الكاميرا للمسح الآلي</button>
    <div id="reader" style="display: none;"></div>

    <input type="text" id="barcode-input" class="input-box" placeholder="امسح الباركود أو اكتبه هنا..." autofocus autocomplete="off">

    <div class="result-box">
        <div class="field-label">الاسم (بالعربية):</div>
        <div class="field-value" id="name-ar">-</div>

        <div class="field-label">الاسم (بالفرنسية):</div>
        <div class="field-value" id="name-fr">-</div>

        <div class="price-tag" id="price-val">- دج</div>

        <div class="field-label">الوصف:</div>
        <div class="field-value" id="description">-</div>
    </div>
</div>

<script>
    const barcodeInput = document.getElementById('barcode-input');
    const nameAr = document.getElementById('name-ar');
    const nameFr = document.getElementById('name-fr');
    const priceVal = document.getElementById('price-val');
    const description = document.getElementById('description');
    let html5QrCode = null;

    function playBeep() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            osc.type = "sine";
            osc.frequency.setValueAtTime(800, ctx.currentTime);
            osc.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.15);
        } catch(e) {}
    }

    async function fetchProductInfo(barcode) {
        const cleanBarcode = barcode.trim();
        if (!cleanBarcode) return;

        nameAr.textContent = 'جاري البحث...';
        nameFr.textContent = 'Recherche...';
        priceVal.textContent = '- دج';
        description.textContent = '-';

        try {
            const response = await fetch(`/get_product?barcode=${encodeURIComponent(cleanBarcode)}`);
            const data = await response.json();

            if (data.success && data.product) {
                playBeep();
                nameAr.textContent = data.product.name_ar || '-';
                nameFr.textContent = data.product.name_fr || '-';
                priceVal.textContent = `${data.product.price} دج`;
                description.textContent = data.product.description || '-';
            } else {
                nameAr.textContent = 'غير موجود';
                nameFr.textContent = 'Non trouvé';
                priceVal.textContent = '- دج';
                description.textContent = 'لم يتم العثور على المنتج في قاعدة البيانات';
            }
        } catch (error) {
            nameAr.textContent = 'خطأ في الاتصال';
            nameFr.textContent = 'Erreur';
            priceVal.textContent = '- دج';
        } finally {
            barcodeInput.select();
        }
    }

    barcodeInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            fetchProductInfo(barcodeInput.value);
        }
    });

    document.getElementById('start-scan-btn').addEventListener('click', async () => {
        const readerDiv = document.getElementById('reader');
        const scanBtn = document.getElementById('start-scan-btn');

        if (html5QrCode && html5QrCode.isScanning) {
            await html5QrCode.stop();
            readerDiv.style.display = 'none';
            scanBtn.textContent = "📷 فتح الكاميرا للمسح الآلي";
            return;
        }

        readerDiv.style.display = 'block';
        scanBtn.textContent = "❌ إغلاق الكاميرا";

        if (!html5QrCode) {
            html5QrCode = new Html5Qrcode("reader");
        }

        // إعدادات محسّنة خصيصاً للباركود الخطي (EAN / UPC / CODE128)
        const config = {
            fps: 12,
            qrbox: (viewfinderWidth, viewfinderHeight) => {
                // مستطيل عريض مخصص للباركود
                return {
                    width: Math.floor(viewfinderWidth * 0.85),
                    height: Math.floor(viewfinderHeight * 0.40)
                };
            },
            experimentalFeatures: {
                useBarCodeDetectorIfSupported: true
            },
            videoConstraints: {
                facingMode: "environment",
                focusMode: "continuous",
                width: { min: 640, ideal: 1280 },
                height: { min: 480, ideal: 720 }
            }
        };

        html5QrCode.start(
            { facingMode: "environment" },
            config,
            (decodedText) => {
                barcodeInput.value = decodedText;
                fetchProductInfo(decodedText);
                html5QrCode.stop().then(() => {
                    readerDiv.style.display = 'none';
                    scanBtn.textContent = "📷 فتح الكاميرا للمسح الآلي";
                });
            },
            () => {}
        ).catch(err => {
            alert("تأكد من فتح الرابط التشعيبي HTTPS وإعطاء إذن الكاميرا للمتصفح.");
            readerDiv.style.display = 'none';
            scanBtn.textContent = "📷 فتح الكاميرا للمسح الآلي";
        });
    });
</script>
</body>
</html>
