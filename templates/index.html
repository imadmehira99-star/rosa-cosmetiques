<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rosa Cosmétiques - كاشف الأسعار</title>
    <!-- مكتبة قراءة الباركود عبر الكاميرا -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }
        .card {
            background-color: #1e1e1e;
            width: 100%;
            max-width: 420px;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            text-align: center;
        }
        .title {
            color: #e91e63;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #aaa;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .btn-camera {
            background-color: #e91e63;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 15px;
        }
        #reader {
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
            border: 2px solid #e91e63;
        }
        .input-box {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e91e63;
            background-color: #2a2a2a;
            color: #fff;
            font-size: 16px;
            text-align: center;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="title">🌹 ROSA COSMÉTIQUES 🌹</div>
    <div class="subtitle">واجهتك الأولى للعناية والجمال - كاشف الأسعار</div>

    <!-- زر فتح الكاميرا -->
    <button type="button" class="btn-camera" id="start-scan-btn">📷 فتح الكاميرا للمسح الآلي</button>
    
    <!-- نافذة معاينة الكاميرا -->
    <div id="reader" style="display: none;"></div>

    <!-- حقل إدخال الباركود -->
    <input type="text" id="barcode-input" class="input-box" placeholder="امسح الباركود هنا..." autofocus>
</div>

<script>
    const barcodeInput = document.getElementById('barcode-input');
    const html5QrCode = new Html5Qrcode("reader");

    document.getElementById('start-scan-btn').addEventListener('click', () => {
        const readerDiv = document.getElementById('reader');
        readerDiv.style.display = 'block';

        html5QrCode.start(
            { facingMode: "environment" }, // الكاميرا الخلفية للهاتف
            { fps: 15, qrbox: { width: 250, height: 150 } },
            (decodedText) => {
                // وضع الكود الممسوح مباشرة داخل مربع النص
                barcodeInput.value = decodedText;
                
                // إيقاف الكاميرا وإخفاء النافذة
                html5QrCode.stop();
                readerDiv.style.display = 'none';

                // تشغيل حدث البحث تلقائياً
                barcodeInput.dispatchEvent(new Event('input', { bubbles: true }));
            },
            (errorMessage) => { /* جاري البحث عن باركود... */ }
        ).catch(err => {
            alert("تأكد من إعطاء الصلاحية للمتصفح لاستخدام الكاميرا");
            readerDiv.style.display = 'none';
        });
    });
</script>

</body>
</html>
